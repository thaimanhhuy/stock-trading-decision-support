version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
      - ../.env:/app/.env
    environment:
      - APP_ENV=production
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../.env:/app/.env
    depends_on:
      - api
    environment:
      - APP_ENV=production
    restart: unless-stopped

  training:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs
      - ../.env:/app/.env
    environment:
      - APP_ENV=production
    profiles:
      - training

volumes:
  data:
  models:
  logs:
