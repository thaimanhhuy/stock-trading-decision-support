# Logging Configuration

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(levelname)s - %(message)s'

  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(filename)s %(lineno)d %(funcName)s %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_all:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/application/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/application/error.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf8

  file_trading:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/trading/trading.log
    maxBytes: 10485760
    backupCount: 20
    encoding: utf8

  file_audit:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/audit/audit.log
    when: midnight
    interval: 1
    backupCount: 90  # Keep 90 days
    encoding: utf8

  file_model:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/application/model.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf8

loggers:
  # Root logger
  root:
    level: DEBUG
    handlers:
      - console
      - file_all
      - file_error

  # Application loggers
  src:
    level: DEBUG
    handlers:
      - console
      - file_all
    propagate: false

  src.data_ingestion:
    level: DEBUG
    handlers:
      - console
      - file_all
    propagate: false

  src.preprocessing:
    level: DEBUG
    handlers:
      - console
      - file_all
    propagate: false

  src.models:
    level: DEBUG
    handlers:
      - console
      - file_model
    propagate: false

  src.trading_engine:
    level: INFO
    handlers:
      - console
      - file_trading
      - file_audit
    propagate: false

  src.backtesting:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  src.monitoring:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  src.api:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  src.dashboard:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  # Third-party library loggers
  urllib3:
    level: WARNING
    handlers:
      - console
    propagate: false

  tensorflow:
    level: WARNING
    handlers:
      - console
    propagate: false

  matplotlib:
    level: WARNING
    handlers:
      - console
    propagate: false

  yfinance:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  uvicorn:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  fastapi:
    level: INFO
    handlers:
      - console
      - file_all
    propagate: false

  streamlit:
    level: INFO
    handlers:
      - console
    propagate: false
