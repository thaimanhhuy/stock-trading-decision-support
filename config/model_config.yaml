# Model-specific Configuration

arima:
  # Parameter selection
  auto_select: true
  use_aic: true  # Akaike Information Criterion
  use_bic: true  # Bayesian Information Criterion

  # Parameter ranges for auto-selection
  max_p: 5  # Maximum autoregressive order
  max_d: 2  # Maximum differencing order
  max_q: 5  # Maximum moving average order

  # Manual parameters (used if auto_select is false)
  p: 1
  d: 1
  q: 1

  # Seasonal ARIMA
  seasonal: false
  seasonal_order: [0, 0, 0, 0]  # (P, D, Q, s)

  # Fitting
  method: "lbfgs"  # lbfgs, bfgs, newton, nm, powell
  maxiter: 50
  trend: "c"  # c (constant), t (linear), ct (constant+linear), n (none)

  # Prediction
  confidence_level: 0.95

lstm:
  # Architecture
  layers:
    - type: "lstm"
      units: 128
      return_sequences: true
      dropout: 0.2
    - type: "lstm"
      units: 64
      return_sequences: true
      dropout: 0.2
    - type: "lstm"
      units: 32
      return_sequences: false
      dropout: 0.2
    - type: "dense"
      units: 1
      activation: null

  # Input shape
  sequence_length: 60
  n_features: null  # Will be determined from data

  # Compilation
  optimizer:
    type: "adam"
    learning_rate: 0.001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07

  loss: "mse"  # mse, mae, huber
  metrics:
    - "mae"
    - "mse"

  # Training
  epochs: 100
  batch_size: 32
  validation_split: 0.15
  shuffle: false

  # Callbacks
  callbacks:
    early_stopping:
      enabled: true
      monitor: "val_loss"
      patience: 15
      restore_best_weights: true
      min_delta: 0.0001

    reduce_lr:
      enabled: true
      monitor: "val_loss"
      factor: 0.5
      patience: 10
      min_lr: 0.00001

    model_checkpoint:
      enabled: true
      monitor: "val_loss"
      save_best_only: true

  # Regularization
  l1_regularization: 0.0
  l2_regularization: 0.0
  dropout_rate: 0.2
  recurrent_dropout: 0.0

  # Advanced
  bidirectional: false
  attention: false
  use_batch_normalization: false

gru:
  # Architecture
  layers:
    - type: "gru"
      units: 128
      return_sequences: true
      dropout: 0.2
    - type: "gru"
      units: 64
      return_sequences: true
      dropout: 0.2
    - type: "gru"
      units: 32
      return_sequences: false
      dropout: 0.2
    - type: "dense"
      units: 1
      activation: null

  # Input shape
  sequence_length: 60
  n_features: null

  # Compilation
  optimizer:
    type: "adam"
    learning_rate: 0.001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-07

  loss: "mse"
  metrics:
    - "mae"
    - "mse"

  # Training
  epochs: 100
  batch_size: 32
  validation_split: 0.15
  shuffle: false

  # Callbacks
  callbacks:
    early_stopping:
      enabled: true
      monitor: "val_loss"
      patience: 15
      restore_best_weights: true
      min_delta: 0.0001

    reduce_lr:
      enabled: true
      monitor: "val_loss"
      factor: 0.5
      patience: 10
      min_lr: 0.00001

    model_checkpoint:
      enabled: true
      monitor: "val_loss"
      save_best_only: true

  # Regularization
  l1_regularization: 0.0
  l2_regularization: 0.0
  dropout_rate: 0.2
  recurrent_dropout: 0.0

  # Advanced
  bidirectional: false
  use_batch_normalization: false

# Transformer (future enhancement)
transformer:
  enabled: false
  d_model: 128
  n_heads: 8
  n_layers: 6
  d_ff: 512
  dropout: 0.1

# Model evaluation
evaluation:
  metrics:
    regression:
      - mae
      - mse
      - rmse
      - mape
      - r2
    classification:
      - accuracy
      - precision
      - recall
      - f1
    trading:
      - direction_accuracy
      - profit_accuracy

  cross_validation:
    enabled: false
    n_splits: 5
    method: "time_series_split"

# Hyperparameter tuning
hyperparameter_tuning:
  enabled: false
  method: "random_search"  # random_search, grid_search, bayesian
  n_trials: 50
  timeout: 7200  # seconds

  # Parameter search space
  lstm_search_space:
    units: [32, 64, 128, 256]
    dropout: [0.1, 0.2, 0.3, 0.4]
    learning_rate: [0.0001, 0.001, 0.01]
    batch_size: [16, 32, 64]

  gru_search_space:
    units: [32, 64, 128, 256]
    dropout: [0.1, 0.2, 0.3, 0.4]
    learning_rate: [0.0001, 0.001, 0.01]
    batch_size: [16, 32, 64]
