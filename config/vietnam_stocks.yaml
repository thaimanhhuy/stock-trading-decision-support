# Usage examples
# Ví dụ sử dụng

usage_examples:
  download_single_stock:
    description: "Tải dữ liệu một cổ phiếu"
    command: "python scripts/download_historical_data.py --symbols VCB.VN"

  download_multiple_stocks:
    description: "Tải dữ liệu nhiều cổ phiếu"
    command: "python scripts/download_historical_data.py --symbols VCB.VN,FPT.VN,CTG.VN,NVL.VN"

  download_portfolio:
    description: "Tải dữ liệu danh mục đầu tư"
    command: "python scripts/download_historical_data.py --symbols VCB.VN,CTG.VN,BID.VN,TCB.VN,MBB.VN --period 2y"

  train_model:
    description: "Huấn luyện mô hình cho cổ phiếu Việt Nam"
    command: "python scripts/train_model.py --symbols VCB.VN --models lstm,gru"

  run_backtest:
    description: "Chạy backtest cho cổ phiếu Việt Nam"
    command: "python scripts/backtest.py --symbols VCB.VN --strategy moving_average"

# Important notes for Vietnamese stocks
# Lưu ý quan trọng khi giao dịch cổ phiếu Việt Nam

notes:
  yahoo_finance_format:
    - "Sử dụng định dạng {SYMBOL}.VN cho HOSE (Sàn HOSE)"
    - "Sử dụng định dạng {SYMBOL}.HNX cho HNX (Sàn HNX)"
    - "Ví dụ: VCB.VN, FPT.VN, CTG.VN"

  price_limits:
    - "Thị trường Việt Nam có biên độ giao dịch ±7% (±10% cho một số mã)"
    - "Giá tham chiếu được tính từ giá đóng cửa phiên trước"
    - "Giá trần = Giá tham chiếu + 7%"
    - "Giá sàn = Giá tham chiếu - 7%"

  trading_rules:
    - "Khớp lệnh định kỳ (ATO/ATC): 09:00-09:15 và 14:30-14:45"
    - "Khớp lệnh liên tục: 09:15-11:30 và 13:00-14:30"
    - "Đơn vị giao dịch: 10 cổ phiếu cho lô lẻ, 100 cổ phiếu cho lô chẵn"

  settlement:
    - "T+2: Thời gian thanh toán là 2 ngày làm việc sau ngày giao dịch"
    - "Room ngoại: Hạn mức sở hữu nước ngoài (thường 30-49%)"

  data_quality:
    - "Dữ liệu từ Yahoo Finance có thể có độ trễ"
    - "Nên sử dụng nhiều nguồn dữ liệu để xác minh"
    - "Kiểm tra dữ liệu trước khi giao dịch thực tế"
