# Vietnamese Stock Market Configuration
# Cấu hình thị trường chứng khoán Việt Nam

market_info:
  name: "Vietnam Stock Market"
  exchanges:
    hose:
      name: "Ho Chi Minh Stock Exchange"
      code: "HOSE"
      yahoo_suffix: ".VN"
      description: "Sàn giao dịch Chứng khoán Thành phố Hồ Chí Minh"
    hnx:
      name: "Hanoi Stock Exchange"
      code: "HNX"
      yahoo_suffix: ".HNX"
      description: "Sàn giao dịch Chứng khoán Hà Nội"
    upcom:
      name: "Unlisted Public Company Market"
      code: "UPCOM"
      yahoo_suffix: ".VN"
      description: "Thị trường chứng khoán các công ty đại chúng chưa niêm yết"

  timezone: "Asia/Ho_Chi_Minh"  # UTC+7
  currency: "VND"

  trading_hours:
    order_matching:
      morning:
        start: "09:00"
        end: "11:30"
      afternoon:
        start: "13:00"
        end: "14:45"
    continuous_trading:
      morning:
        start: "09:15"
        end: "11:30"
      afternoon:
        start: "13:00"
        end: "14:30"

  trading_days:
    weekdays: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
    holidays:
      - "New Year's Day"
      - "Lunar New Year (Tet)"
      - "Hung Kings' Commemoration"
      - "Reunification Day"
      - "International Labor Day"
      - "National Day"

